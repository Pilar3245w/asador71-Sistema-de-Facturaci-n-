<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asador 71 - Facturación</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <!-- Framework: Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

  <!-- Estilos propios (después de Bootstrap, para personalizarlo) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra d-flex flex-wrap align-items-center gap-3 px-3 px-md-4 py-1">
    <img src="img/logo.jpg" alt="Asador 71 Steakhouse" class="logo">
    <div>
      <h1 class="h5 mb-0">Facturación</h1>
      <p class="mb-0 text-secondary">Caja y comprobantes</p>
    </div>
  </header>

  <div class="banner">
    <img src="img/banner.jpg" alt="Asador 71 Steakhouse, carne premium">
  </div>

  <main class="container-xxl py-3">
    <div class="row g-3">

      <!-- Carta -->
      <section class="col-lg-8">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0">Carta</h2>
              <button id="btn-nuevo" class="btn btn-llama">+ Nuevo plato</button>
            </div>
            <div id="lista-productos" class="row g-3"></div>
          </div>
        </div>
      </section>

      <!-- Pedido -->
      <section class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Pedido</h2>
            <ul id="lista-pedido" class="list-group list-group-flush mb-3"></ul>

            <div class="row g-2">
              <div class="col-6">
                <label class="form-label small text-secondary" for="mesa">Mesa</label>
                <input id="mesa" class="form-control" type="number" min="1" value="1">
              </div>
              <div class="col-6">
                <label class="form-label small text-secondary" for="tipo">Comprobante</label>
                <select id="tipo" class="form-select"><option>Boleta</option><option>Factura</option></select>
              </div>
              <div class="col-12">
                <input id="documento" class="form-control" placeholder="DNI (8 dígitos) o RUC (11 dígitos)" inputmode="numeric" maxlength="11">
                <small id="estado-doc" class="form-text"></small>
              </div>
              <div class="col-12">
                <input id="cliente" class="form-control" placeholder="Nombre o razón social">
              </div>
            </div>

            <div class="mt-3">
              <div class="d-flex justify-content-between text-secondary">
                <span>Subtotal</span><span id="subtotal" class="text-body">S/ 0.00</span>
              </div>
              <div class="d-flex justify-content-between text-secondary">
                <span id="etq-igv">IGV</span><span id="igv" class="text-body">S/ 0.00</span>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-1">
                <strong>Total</strong><span id="total" class="total">S/ 0.00</span>
              </div>
            </div>

            <button id="btn-generar" class="btn btn-llama btn-lg w-100 mt-3">Generar comprobante</button>
          </div>
        </div>
      </section>

      <!-- Ventas -->
      <section class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-2">
              <h2 class="h5 mb-0">Ventas</h2>
              <div class="d-flex flex-wrap align-items-end gap-2">
                <div>
                  <label class="form-label small text-secondary mb-0" for="desde">Desde</label>
                  <input type="date" id="desde" class="form-control form-control-sm">
                </div>
                <div>
                  <label class="form-label small text-secondary mb-0" for="hasta">Hasta</label>
                  <input type="date" id="hasta" class="form-control form-control-sm">
                </div>
                <button id="btn-hoy" class="btn btn-outline-light btn-sm">Hoy</button>
                <button id="btn-excel" class="btn btn-outline-light btn-sm">Excel</button>
                <button id="btn-informe" class="btn btn-llama btn-sm">Generar informe</button>
              </div>
            </div>
            <p id="resumen" class="text-secondary"></p>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr>
                    <th>N°</th><th>Fecha</th><th>Hora</th><th>Mesa</th><th>Cliente</th>
                    <th class="text-end">Total</th><th></th>
                  </tr>
                </thead>
                <tbody id="tabla-ventas"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Ventana: nuevo plato / editar plato -->
  <dialog id="dialogo-plato">
    <form id="form-producto" class="d-grid gap-3">
      <h3 id="titulo-dialogo" class="h5 mb-0">Nuevo plato</h3>
      <input type="hidden" id="id-p">
      <div>
        <label class="form-label" for="nombre-p">Nombre</label>
        <input id="nombre-p" class="form-control" placeholder="Ej: Lomo fino" required>
      </div>
      <div>
        <label class="form-label" for="precio-p">Precio (S/)</label>
        <input id="precio-p" class="form-control" type="number" step="0.01" min="0" required>
      </div>
      <div>
        <label class="form-label" for="imagen-p" id="etq-foto">Foto del plato</label>
        <input id="imagen-p" class="form-control" type="file" accept="image/*">
      </div>
      <div class="d-flex justify-content-end gap-2">
        <button type="button" id="btn-cancelar" class="btn btn-outline-light">Cancelar</button>
        <button type="submit" class="btn btn-llama">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Comprobante e informe: tema claro, como un papel impreso -->
  <dialog id="comprobante" data-bs-theme="light"></dialog>
  <dialog id="informe" data-bs-theme="light"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
